name: Release

# Publishes to npm when a version tag (for example v1.0.1) is pushed.
# Uses npm trusted publishing (OIDC): no long-lived npm token is stored in GitHub,
# and npm attaches a provenance attestation to every published version.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the trusted publishing token exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node test/smoke.mjs
      - run: node test/smoke.cjs

      - name: Publish
        run: npm publish
